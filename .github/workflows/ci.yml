# CI for ЖАР: typecheck → Jest (unit + contract) → web export → Playwright (Chromium, Pixel 7 viewport).
# Locally Chromium lives in /opt/pw-browsers — never run `playwright install` on a dev box; CI installs its own.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit and contract tests (Jest)
        run: npm test -- --ci

      - name: Build web export
        run: npx expo export --platform web --output-dir dist

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E, UX and visual tests (Playwright)
        # playwright.config.ts serves the existing dist/ on :4173 (no rebuild: E2E_REBUILD is unset)
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/.artifacts/report
            tests/e2e/.artifacts/results
          retention-days: 14
